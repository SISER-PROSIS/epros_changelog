<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siser ERP — Atualizações</title>
    <link rel="icon" href="./favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: "DM Sans", sans-serif;
            background-image: linear-gradient(
                rgb(248, 250, 252),
                rgb(248, 250, 252)
            ) !important;
            background-clip: border-box !important;
            background-size: 100vw 100vh !important;
        }

        aside {
            background-image: linear-gradient(
            rgb(255, 255, 255),
            rgb(255, 255, 255)
            ) !important;
            background-clip: border-box !important;
        }

        h1 {
            line-height: normal !important;
            color: rgb(15, 23, 42) !important;
            font-weight: 700 !important;
            font-style: normal !important;
            font-size: 1.25rem !important;
        }

        h2 {
            line-height: normal !important;
            color: rgb(15, 23, 42) !important;
            caret-color: rgb(15, 23, 42) !important;
            font-weight: 700 !important;
            font-style: normal !important;
            font-size: 1.75rem !important;
        }

        h3 {
            line-height: normal !important;
            color: rgb(15, 23, 42) !important;
            caret-color: rgb(15, 23, 42) !important;
            font-weight: 700 !important;
            font-style: normal !important;
            font-size: 1.125rem !important;
        }

        p {
            line-height: normal !important;
            color: rgb(51, 65, 85) !important;
            caret-color: rgb(51, 65, 85) !important;
            font-weight: 400 !important;
            font-style: normal !important;
            font-size: 0.9375rem !important;
        }

        .release-btn {
            line-height: normal !important;
            color: rgb(51, 65, 85) !important;
            caret-color: rgb(51, 65, 85) !important;
            font-weight: 400 !important;
            font-style: normal !important;
            font-size: 0.9375rem !important;
        }

        .release-btn.active {
            line-height: normal !important;
            color: rgb(255, 255, 255) !important;
            caret-color: rgb(255, 255, 255) !important;
            font-weight: 400 !important;
            font-style: normal !important;
            font-size: 0.9375rem !important;
            background: #1e293b;
        }

        .release-panel {
            display: none;
        }

        .release-panel.active {
            display: block;
        }

        .annotation-desc p {
            margin-bottom: 0.5rem;
        }

        .annotation-desc strong {
            font-weight: 700;
        }

        .annotation-desc em {
            font-style: italic;
        }

        .annotation-desc code {
            background: #f1f5f9;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .annotation-desc ul,
        .annotation-desc ol {
            margin: 0.5rem 0 0.5rem 1.25rem;
        }

        .annotation-desc li {
            margin-bottom: 0.25rem;
        }

        .annotation-desc a {
            color: rgb(37, 99, 235);
            text-decoration: underline;
        }

        .annotation-desc img {
            max-width: 100%;
            height: auto;
            margin-top: 0.75rem;
            border-radius: 0.5rem;
        }

        .annotation-desc blockquote {
            border-left: 3px solid rgb(203, 213, 225);
            padding-left: 0.75rem;
            color: rgb(100, 116, 139);
        }

        .site-header h1 {
            font-size: 1.125rem !important;
        }

        .site-header p {
            font-size: 0.8125rem !important;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">
    <header class="site-header sticky top-0 z-20 flex-shrink-0 border-b border-slate-200 bg-white/95 backdrop-blur-sm">
        <div class="flex items-center gap-3 px-6 py-4 mx-auto w-full">
            <img src="./siser.png" alt="" width="36" height="36" class="rounded-lg" />
            <div>
                <h1 class="font-bold text-slate-900">Siser ERP</h1>
                <p class="text-slate-500 mt-0.5">Atualizações do sistema</p>
            </div>
        </div>
    </header>
    <div class="flex flex-1 min-h-0">
        <aside class="canva-sidebar w-64 min-h-0 p-6 flex-shrink-0 border-r border-slate-200 overflow-y-auto">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-4">Atualizações</p>
            <nav id="nav-list" class="space-y-2"></nav>
        </aside>
        <main class="flex-1 w-full max-w-4xl mx-auto p-10 overflow-y-auto">
            <section class="flex flex-col gap-2 mb-10 pb-8 border-b border-slate-200" aria-labelledby="page-intro-title">
                <h2 id="page-intro-title" class="font-bold text-slate-900">Central de atualizações</h2>
                <p class="text-slate-600 leading-relaxed max-w-2xl">
                    Acompanhe as novidades, melhorias e correções do Siser ERP.
                    Selecione uma versão na barra lateral para ver o que mudou em cada atualização.
                </p>
            </section>
            <h2 id="release-date" class="font-bold mb-8 text-slate-900"></h2>
            <div id="release-content">
                <div class="flex items-center gap-3 text-slate-400 text-sm py-10">
                    <div class="dot-pulse"><span></span><span></span><span></span></div>
                    Carregando...
                </div>
            </div>
        </main>
    </div>
    <script>
        const BASE = './releases';
        let releases = [];
        const cache = {};

        if (typeof marked !== 'undefined') {
          const mdOpts = { gfm: true, breaks: true };
          if (typeof marked.use === 'function') marked.use(mdOpts);
          else if (typeof marked.setOptions === 'function') marked.setOptions(mdOpts);
        }

        function mdToHtml(markdown) {
          if (!markdown) return '';
          return marked.parse(markdown.trim());
        }

        const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho',
                        'julho','agosto','setembro','outubro','novembro','dezembro'];
        
        function fmtDate(iso) {
          const [y, m, d] = iso.split('-');
          return `${parseInt(d)} de ${MONTHS[parseInt(m)-1]} de ${y}`;
        }
        
        // ── parse .md ──────────────────────────────────────────────────────────────
        // Formato esperado:
        //   ### Título do item
        //   tags: Tag1, Tag2
        //   Linha de descrição 1
        //   Linha de descrição 2
        //
        function parseMd(raw) {
          // remove frontmatter
          const body = raw.replace(/^---[\s\S]*?---\n/, '').trim();
          const items = [];
          const blocks = body.split(/^###\s+/m).filter(Boolean);
        
          for (const block of blocks) {
            const lines = block.trim().split('\n');
            const title = lines[0].trim();
            let tags = [];
            const descLines = [];

            for (let i = 1; i < lines.length; i++) {
              const line = lines[i];
              const trimmed = line.trim();
              if (i === 1 && trimmed.toLowerCase().startsWith('tags:')) {
                tags = trimmed.replace(/^tags:\s*/i, '').split(',').map(t => t.trim()).filter(Boolean);
              } else if (trimmed || descLines.length) {
                descLines.push(line);
              }
            }

            items.push({ title, tags, desc: descLines.join('\n').trim() });
          }
          return items;
        }
        
        // ── tag helpers ───────────────────────────────────────────────────────────
        function tagClass(tag) {
          const t = tag.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if (t === 'novidade')  return 'bg-emerald-100 text-emerald-700';
          if (t === 'melhoria')  return 'bg-orange-100 text-orange-700';
          if (t === 'correcao')  return 'bg-red-100 text-red-700';
          return 'bg-gray-100 text-gray-700';
        }
        
        function cardClass(tags) {
          const first = (tags[0]||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if (first === 'novidade') return 'border-emerald-400';
          if (first === 'melhoria') return 'border-orange-400';
          if (first === 'correcao') return 'border-red-400';
          return 'card-default';
        }
        
        // ── render panel ──────────────────────────────────────────────────────────
        function renderPanel(items) {
          return items.map(item => `
              <article class="mt-1 mb-8 border-l-4 ${cardClass(item.tags)} pl-5">
                <div class="flex flex-wrap gap-1.5 mb-1.5">
                    ${item.tags.map(t => `<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold ${tagClass(t)}">${t}</span>`).join('')}
                </div>
                <h3 class="font-bold mt-1 mb-2">${item.title}</h3>
                <div class="annotation-desc text-slate-700 text-sm leading-relaxed space-y-1">
                    ${mdToHtml(item.desc)}
                </div>
              </article>
            `).join('');
        }
        
        // ── nav ───────────────────────────────────────────────────────────────────
        function buildNav() {
          const nav = document.getElementById('nav-list');
          nav.innerHTML = releases.map((r, i) => `
            <button type="button" data-idx="${i}" class="release-btn ${i === 0 ? 'active' : ''} w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition">
                ${fmtDate(r.date)}
            </button>
          `).join('');
          nav.querySelectorAll('.release-btn').forEach(btn => {
            btn.addEventListener('click', () => selectRelease(Number(btn.dataset.idx)));
          });
        }
        
        // ── select ────────────────────────────────────────────────────────────────
        async function selectRelease(idx) {
          document.querySelectorAll('.release-btn').forEach((b, i) => b.classList.toggle('active', i === idx));

          const r = releases[idx];
          document.getElementById('release-date').textContent = fmtDate(r.date);

          const content = document.getElementById('release-content');
          if (cache[idx]) {
            content.innerHTML = cache[idx];
            return;
          }

          content.innerHTML = `<div class="flex items-center gap-3 text-slate-400 text-sm py-10">
            <div class="dot-pulse"><span></span><span></span><span></span></div> Carregando...
          </div>`;

          const res = await fetch(`${BASE}/${r.file}`);
          const raw = await res.text();
          const items = parseMd(raw);
          const html = renderPanel(items);
          cache[idx] = html;
          content.innerHTML = html;
        }
        
        // ── init ──────────────────────────────────────────────────────────────────
        async function init() {
          const res = await fetch(`${BASE}/index.json`);
          releases = await res.json();
          buildNav();
          await selectRelease(0);
        }
        
        init();
    </script>
</body>

</html>
